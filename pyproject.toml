[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ouv"
version = "0.1.0"
description = "Odoo 18 -> 19 Upgrade Validator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.17.0",
    "psycopg2-binary>=2.9.0",
    "manifestoo-core>=1.0.0",
]

[project.scripts]
ouv = "ouv.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
