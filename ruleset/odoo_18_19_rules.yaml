  - id: SECURITY_GROUP_CATEGORY_ID_REPLACED
    category: security_xml
    severity: blocking
    evidence: COMMUNITY
    description: >
      In Odoo 19 a new 'res.groups.privilege' model was introduced as an
      intermediate layer.  Security XML that defines res.groups records with a
      'category_id' field pointing directly to ir.module.category will fail at
      module install.  Groups must now reference 'privilege_id'.
      (Confirmed: cybrosys.com, wcblog.in, winotto.com, multiple odoo.com
       forum threads — all 2025.)
    check_type: xpath
    xpath_pattern: "//record[@model='res.groups']/field[@name='category_id']"
    applies_to: "**/security/*.xml"
    fix_hint: >
      Create a res.groups.privilege record first:
        <record id="privilege_my_module" model="res.groups.privilege">
            <field name="name">My Module Access</field>
            <field name="category_id" ref="base.module_category_..."/>
        </record>
      Then reference it from your group:
        <record id="group_my_module_user" model="res.groups">
            <field name="name">User</field>
            <field name="privilege_id" ref="privilege_my_module"/>
        </record>
    source: "Community: cybrosys.com, wcblog.in, winotto.com, odoo.com forum (2025)"

