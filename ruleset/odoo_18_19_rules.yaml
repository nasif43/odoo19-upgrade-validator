  - id: MANIFEST_VERSION_STRING
    category: manifest
    severity: blocking
    evidence: OFFICIAL
    description: >
      The 'version' key in __manifest__.py must start with '19.0' for Odoo 19
      modules.  A module still carrying '18.0.x.y.z' will install on Odoo 19
      but will be rejected by upgrade tooling and may cause subtle
      dependency-ordering bugs.
    check_type: regex
    pattern: "^\\s*['\"]version['\"]\\s*:\\s*['\"](?!19\\.0)[^'\"]*['\"]"
    applies_to: "**/__manifest__.py"
    fix_hint: >
      Change the version value to '19.0.x.y.z' (e.g. '19.0.1.0.0').
      Convention: the first two segments are the Odoo major version (19.0)
      followed by three application-level integers.
    source: "https://www.odoo.com/documentation/19.0/developer/reference/module.html"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
    install_error_signatures: []

