  - id: ORM_API_RETURNS_REMOVED
    category: python_api
    severity: blocking
    evidence: COMMUNITY
    description: >
      The '@api.returns' decorator has been removed in Odoo 19 as part of the
      API cleanup.  Methods decorated with '@api.returns' will raise
      AttributeError or be ignored at module load.  Simply removing the
      decorator is the fix in most cases.
      (Confirmed: reddit.com/r/Odoo 2025, cybrosys.com migration guide 2025,
       multiple independent forum posts.)
    check_type: ast
    ast_pattern: "decorator_name == 'api.returns'"
    applies_to: "**/*.py"
    fix_hint: >
      Remove the @api.returns decorator entirely.  The ORM handles return
      values without it.  If the decorator was enforcing a specific record
      type, add an explicit assertion or isinstance check instead.
    source: "Community: reddit.com/r/Odoo (solved threads, 2025), cybrosys.com Odoo 19 migration guide"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
