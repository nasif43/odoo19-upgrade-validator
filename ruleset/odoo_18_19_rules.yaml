  - id: QWEB_INLINE_SCRIPT_FORBIDDEN
    category: qweb
    severity: blocking
    evidence: OFFICIAL
    description: >
      Inline <script> tags inside QWeb templates are forbidden in Odoo 19 due
      to enforced Content Security Policy (CSP) headers.  Modules using inline
      <script> blocks in QWeb cause CSP violations and broken UI.
    check_type: xpath
    xpath_pattern: "//script[not(@t-call-assets)]"
    applies_to: "**/templates/*.xml"
    fix_hint: >
      Move all JavaScript to static .js files and register them in the module
      asset bundle via __manifest__.py:
        'assets': {
            'web.assets_backend': [
                'my_module/static/src/js/my_file.js',
            ],
        }
    source: "https://www.odoo.com/documentation/19.0/developer/reference/frontend/assets.html"

