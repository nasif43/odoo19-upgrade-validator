  - id: ORM_READ_GROUP_DEPRECATED
    category: python_api
    severity: warning
    evidence: OFFICIAL
    description: >
      'read_group()' was officially deprecated in Odoo 18.2 (PR #163300) in
      favour of '_read_group()' for backend use and 'formatted_read_group()'
      as the public API.  Calling 'read_group()' in Odoo 19 triggers
      DeprecationWarning.
    check_type: ast
    ast_pattern: "method_call_name == 'read_group'"
    applies_to: "**/*.py"
    fix_hint: >
      For backend aggregation:
        self._read_group(domain, groupby=['field'], aggregates=['amt:sum'])
      For public/RPC-exposed calls:
        self.formatted_read_group(domain, groupby=['field'], aggregates=['amt:sum'])
    source: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html (18.2 section, PR #163300)"

