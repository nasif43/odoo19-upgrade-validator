  - id: ORM_CHECK_ACCESS_RIGHTS_DEPRECATED
    category: python_api
    severity: blocking
    evidence: OFFICIAL
    description: >
      'check_access_rights()' and 'check_access_rule()' are superseded in
      Odoo 18.0 (PR #179148) by the unified 'check_access()', 'has_access()',
      and '_filtered_access()' API.  Both old methods raise DeprecationWarning
      in Odoo 19 and may be removed in a patch release.
    check_type: ast
    ast_pattern: "method_call_name in ('check_access_rights', 'check_access_rule')"
    applies_to: "**/*.py"
    fix_hint: >
      Replace:
        self.check_access_rights('read')  ->  self.check_access('read')
        self.check_access_rule('write')   ->  self.check_access('write')
      Boolean check (no exception raised):
        self.has_access('read')           # returns True/False
      Filtered recordset:
        valid = self._filtered_access('read')
    source: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html (18.0 section, PR #179148)"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
    install_error_signatures: []

