  - id: ORM_NAME_GET_DEPRECATED
    category: python_api
    severity: warning
    evidence: OFFICIAL
    description: >
      'name_get()' was officially deprecated in Odoo 16.4 (PR #122085) and is
      not called by the web client since Odoo 17.  Modules overriding
      'name_get' produce wrong display labels in Odoo 19 silently.
      Replacement: override '_compute_display_name'.
    check_type: ast
    ast_pattern: "function_def_name == 'name_get'"
    applies_to: "**/*.py"
    fix_hint: >
      Replace name_get() with _compute_display_name():
        @api.depends('name', 'partner_id')  # add all contributing fields
        def _compute_display_name(self):
            for rec in self:
                rec.display_name = f"{rec.name} ({rec.partner_id.name})"
    source: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html (16.4 section, PR #122085)"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
