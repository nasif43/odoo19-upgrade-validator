  - id: CONTROLLER_JSON_TYPE_RENAMED
    category: controller
    severity: warning
    evidence: OFFICIAL
    description: >
      In Odoo 18.1 (PR #183636, official ORM changelog), the HTTP route type
      'json' was renamed to 'jsonrpc'.  Using type='json' in @http.route()
      triggers DeprecationWarning in Odoo 19 and will be removed in a future
      release.
    check_type: regex
    pattern: "type\\s*=\\s*['\"]json['\"]"
    applies_to: "**/*.py"
    fix_hint: >
      Replace:
        @http.route('/path', type='json', auth='user')
      with:
        @http.route('/path', type='jsonrpc', auth='user')
    source: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html (18.1 section, PR #183636)"

