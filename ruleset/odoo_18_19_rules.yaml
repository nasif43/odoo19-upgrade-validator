  - id: QWEB_TCALL_ASSETS_FILTER_ATTRS
    category: qweb
    severity: warning
    evidence: COMMUNITY
    description: >
      The 't-js' and 't-css' filter attributes on 't-call-assets' directives
      are no longer supported.  Odoo 19 logs "Unknown directive or unused
      attribute".  Asset filtering must be done at bundle-definition level.
      (Confirmed: odoo.com forum threads, community reports — 2025.)
    check_type: xpath
    xpath_pattern: "//t[@t-call-assets and (@t-js or @t-css)]"
    applies_to: "**/*.xml"
    fix_hint: >
      Remove t-js="false" or t-css="false" from t-call-assets tags.
      Separate JS-only or CSS-only bundles must be defined in __manifest__.py
      'assets' key and called independently.
    source: "Community: odoo.com forum, cybrosys.com asset management guide (2025)"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
