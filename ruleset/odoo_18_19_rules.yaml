  - id: ORM_SQL_CONSTRAINTS_REMOVED
    category: python_api
    severity: blocking
    evidence: COMMUNITY
    description: >
      '_sql_constraints' list-of-tuples is silently ignored in Odoo 19.
      Constraints defined this way are NOT created in the database, leaving
      data integrity at risk with no install-time error.
      Replacement: models.Constraint class attributes.
      (Confirmed: odoo.com forum answer, cybrosys.com 2025, codeerts.com 2025,
       multiple independent reports.)
    check_type: ast
    ast_pattern: "attribute_assignment_name == '_sql_constraints'"
    applies_to: "**/*.py"
    fix_hint: >
      Replace the _sql_constraints list with individual models.Constraint
      class attributes:
        BEFORE:
          _sql_constraints = [
              ('unique_code', 'UNIQUE(code)', 'Code must be unique!'),
          ]
        AFTER:
          _unique_code = models.Constraint(
              'UNIQUE(code)', 'Code must be unique!'
          )
    source: "Community: odoo.com forum (accepted answers 2025), cybrosys.com, codeerts.com"

    # Learning loop fields (auto-populated — do not edit by hand):
