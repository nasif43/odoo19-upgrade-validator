  - id: ORM_OSV_IMPORT
    category: python_api
    severity: blocking
    evidence: OFFICIAL
    description: >
      The 'odoo.osv' module is officially deprecated in Odoo 19 (PR #217708).
      'from odoo.osv import expression' or
      'from odoo.osv.expression import AND, OR, NOT' produce
      DeprecationWarnings and are scheduled for removal.
      Replacement: odoo.fields.Domain class.
    check_type: ast
    ast_pattern: "import_from_module starts_with 'odoo.osv'"
    applies_to: "**/*.py"
    fix_hint: >
      Replace:
        from odoo.osv import expression
        from odoo.osv.expression import AND, OR, NOT
      with:
        from odoo.fields import Domain
        combined = Domain(domain1) & Domain(domain2)  # AND
        combined = Domain(domain1) | Domain(domain2)  # OR
        negated  = ~Domain(domain1)                   # NOT
    source: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html (19.0 section, PR #217708)"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
    install_error_signatures: []

  - id: ORM_OPENERP_IMPORT
