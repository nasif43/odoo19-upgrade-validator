    applies_to: "**/*.xml"
    fix_hint: >
      Replace states= with an invisible= expression:
        BEFORE: <field name="x" states="done,cancel"/>
        AFTER:  <field name="x" invisible="state not in ('done','cancel')"/>
      Carefully verify logic direction for each instance.
    source: "Community: medium.com (2025), cybrosys.com, odoo.com forum solved threads"

