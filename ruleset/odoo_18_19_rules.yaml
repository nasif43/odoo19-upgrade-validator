  - id: VIEW_ATTRS_REMOVED
    category: view_xml
    severity: blocking
    evidence: OFFICIAL
    description: >
      The 'attrs' XML attribute for conditional modifiers (invisible, readonly,
      required) was removed in Odoo 17 and is absent in Odoo 19.  Fields,
      groups, and buttons using attrs="{'invisible': [...]}" will fail view
      validation at module install.
    check_type: xpath
    xpath_pattern: "//*[@attrs]"
    applies_to: "**/*.xml"
    fix_hint: >
      Convert attrs= to direct inline Python boolean expressions:
        BEFORE: <field name="x" attrs="{'invisible': [('state','=','draft')]}"/>
        AFTER:  <field name="x" invisible="state == 'draft'"/>
      Multiple modifiers on one element:
        BEFORE: attrs="{'invisible': [('a','=',1)], 'readonly': [('b','=',True)]}"
        AFTER:  invisible="a == 1" readonly="b == True"
    source: "https://www.odoo.com/documentation/19.0/developer/reference/user_interface/view_architectures.html"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
    install_error_signatures: []

