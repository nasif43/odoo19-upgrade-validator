  - id: SCSS_IMPORT_DEPRECATED
    category: scss
    severity: warning
    evidence: COMMUNITY
    description: >
      Odoo 19 uses Dart Sass exclusively.  The '@import' directive is deprecated
      in Dart Sass (scheduled for removal in Dart Sass 2.0) and causes
      compilation warnings or failures in Odoo 19's asset pipeline.
      (Confirmed: stackoverflow, medium.com, github.com issues with Dart Sass
       in Odoo 19 context — 2025.)
    check_type: regex
    pattern: "^\\s*@import\\s+"
    applies_to: "**/*.scss"
    fix_hint: >
      Replace @import with @use or @forward:
        BEFORE: @import 'variables';
        AFTER:  @use 'variables';            (access as variables.$var)
             OR @use 'variables' as *;      (preserves global namespace)
      For re-exporting to other partials, use @forward.
    source: "Community: stackoverflow.com, medium.com Odoo 19 SCSS guides, Dart Sass upstream"

    # Learning loop fields (auto-populated — do not edit by hand):
    confirmed_in_module_count: 0
    confirmed_fixes: []
